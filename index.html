



<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>محميات سوريا</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --accent: #4ade80;
    --accent2: #22d3ee;
    --text: #e8eaf6;
    --text-muted: #7c85b0;
    --error: #f87171;
    --radius: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Tajawal', sans-serif;
    direction: rtl;
    text-align: right;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 20px;
}

.container {
    max-width: 900px;
    margin: 0 auto;
}

header {
    text-align: center;
    margin-bottom: 40px;
}

header h1 {
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
    margin-bottom: 6px;
}

header p {
    color: var(--text-muted);
    font-size: 0.95rem;
}

.header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 18px;
    width: 100%;
}

.logo {
    display: block;
    max-width: 420px;
    height: auto;
}

.header-text {
    text-align: center;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text);
    line-height: 1.7;
    white-space: nowrap;
}

.search-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 30px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    min-width: 180px;
}

.field label {
    font-size: 0.82rem;
    color: var(--text-muted);
    font-weight: 500;
}

.field input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
}

.field select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
    cursor: pointer;
}

.field select:focus {
    border-color: var(--accent);
}

.field input:focus {
    border-color: var(--accent);
}

.field input::placeholder {
    color: var(--text-muted);
}

button {
    background: var(--accent);
    color: #0f1117;
    border: none;
    border-radius: 8px;
    padding: 10px 28px;
    font-family: 'Tajawal', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    white-space: nowrap;
    align-self: flex-end;
}

button:hover { opacity: 0.88; }
button:active { transform: scale(0.97); }

#status {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-bottom: 16px;
    min-height: 22px;
}

.results-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
}

.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
}

.card:hover {
    border-color: var(--accent2);
    transform: translateY(-3px);
}

.card-images {
    display: flex;
    flex-direction: row;
    width: 100%;
    height: 180px;
    gap: 2px;
}

.card-image {
    flex: 1;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: var(--surface2);
    min-width: 0;
}

.card-image-empty {
    flex: 1;
    width: 100%;
    height: 100%;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 1.6rem;
    min-width: 0;
}

.card-no-image {
    width: 100%;
    height: 120px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 2rem;
}

.card-body {
    padding: 16px;
}

.card-body h3 {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
}

.brief-text {
    font-size: 0.9rem;
    color: var(--text);
    line-height: 1.6;
    margin-bottom: 12px;
}

.info-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
    gap: 8px;
}

.info-label {
    font-size: 0.8rem;
    color: var(--text-muted);
    white-space: nowrap;
}

.info-value {
    font-size: 0.85rem;
    color: var(--text);
    text-align: left;
    direction: rtl;
}

.info-value a {
    color: var(--accent2);
    text-decoration: none;
}

.info-value a:hover {
    text-decoration: underline;
}

.badge {
    display: inline-block;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 10px;
    font-size: 0.75rem;
    color: var(--accent2);
    margin-top: 8px;
}

.error-msg {
    color: var(--error);
    background: #1f1215;
    border: 1px solid var(--error);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
}
</style>
</head>

<body>
<div class="container">

    <header>
        <div class="header-top">
            <div class="header-text">
                <div>الجمهورية العربية السورية</div>
                <div>وزارة الإدارة المحلية والبيئة</div>
            </div>
            <img src="logo.png" alt="شعار الموقع" class="logo">
            <div class="header-text">
                <div>مديرية التنوع الحيوي والأراضي</div>
                <div>دائرة المحميات</div>
            </div>
        </div>
        <h1>🌿 محميات سوريا</h1>
        <p>ابحث في قاعدة بيانات المحميات الطبيعية</p>
    </header>

    <div class="search-box">
        <div class="field">
            <label>اسم المحمية</label>
            <select id="nameInput">
                <option value="">-</option>
            </select>
        </div>
        <div class="field">
            <label>المحافظة</label>
            <select id="govInput">
                <option value="">-</option>
            </select>
        </div>
        <div class="field">
            <label>النوع السائد</label>
            <select id="typeInput">
                <option value="">-</option>
            </select>
        </div>
        <button onclick="searchReserve()">بحث</button>
    </div>

    <div id="status"></div>
    <div id="results" class="results-grid"></div>

</div>

<script>
const BASEROW_URL = "https://api.baserow.io/api/database/rows/table/832302/?user_field_names=true&size=200";
const BASEROW_TOKEN = "TOKEN 6rCY8gbPUZwXYcdyUtHPpTnlVuqqFwaj";

// تعبئة القوائم المنسدلة بالقيم الموجودة فعليًا بقاعدة البيانات
async function populateFilters() {
    try {
        const response = await fetch(BASEROW_URL, {
            headers: { "Authorization": BASEROW_TOKEN }
        });
        const data = await response.json();
        if (!data.results) return;

        const names = new Set();
        const govs = new Set();
        const types = new Set();

        data.results.forEach(row => {
            names.add(extractValue(row["اسم المحمية"]));
            govs.add(extractValue(row["المحافظة"]));
            types.add(extractValue(row["النوع السائد"]));
        });

        names.delete("");
        govs.delete("");
        types.delete("");

        fillSelect("nameInput", names);
        fillSelect("govInput", govs);
        fillSelect("typeInput", types);

    } catch (error) {
        console.error("تعذّر تحميل قوائم البحث:", error);
    }
}

function extractValue(field) {
    if (!field) return "";
    if (typeof field === "string") return field.trim();
    if (Array.isArray(field)) {
        return field.map(f => (f && f.value) ? f.value : f).join("، ");
    }
    if (typeof field === "object" && field.value) return field.value;
    return String(field);
}

function fillSelect(id, valuesSet) {
    const select = document.getElementById(id);
    const values = Array.from(valuesSet).sort((a, b) => a.localeCompare(b, 'ar'));
    values.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = v;
        select.appendChild(opt);
    });
}

window.addEventListener("DOMContentLoaded", populateFilters);

// دالة بسيطة لتفادي مشاكل HTML عند طباعة نص المستخدم
function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

async function searchReserve() {
    const resultsDiv = document.getElementById("results");
    const statusDiv = document.getElementById("status");

    resultsDiv.innerHTML = "";
    statusDiv.textContent = "جاري البحث...";

    const nameValue = encodeURIComponent(document.getElementById("nameInput").value);
    const govValue  = encodeURIComponent(document.getElementById("govInput").value);
    const typeValue = encodeURIComponent(document.getElementById("typeInput").value);

    let url = "https://api.baserow.io/api/database/rows/table/832302/?user_field_names=true";
    if (nameValue) url += "&filter__اسم المحمية__contains=" + nameValue;
    if (govValue)  url += "&filter__المحافظة__contains=" + govValue;
    if (typeValue) url += "&filter__النوع السائد__contains=" + typeValue;

    try {
        const response = await fetch(url, {
            headers: { "Authorization": "TOKEN 6rCY8gbPUZwXYcdyUtHPpTnlVuqqFwaj" }
        });

        const data = await response.json();

        if (!response.ok) {
            statusDiv.textContent = "";
            resultsDiv.innerHTML = `<div class="error-msg">خطأ ${response.status}: ${JSON.stringify(data)}</div>`;
            return;
        }

        if (!data.results || data.results.length === 0) {
            statusDiv.textContent = "لا توجد نتائج مطابقة";
            return;
        }

        statusDiv.textContent = `تم العثور على ${data.results.length} نتيجة`;

        data.results.forEach(row => {
            // استخراج روابط الصور الثلاث (مع إطار فارغ للصور غير الموجودة)
            const imageFields = [
                row["صورة المحمية"],
                row["صورة المحمية1"],
                row["صورة المحمية2"]
            ];

            const imageHtml = `<div class="card-images">
                ${imageFields.map(f => {
                    const url = Array.isArray(f) && f.length > 0 ? f[0].url : null;
                    return url
                        ? `<img src="${url}" class="card-image" alt="صورة المحمية">`
                        : `<div class="card-image-empty">🌲</div>`;
                }).join("")}
               </div>`;

            const locationUrl = row["Location"] || "";

            resultsDiv.innerHTML += `
                <div class="card">
                    ${imageHtml}
                    <div class="card-body">
                        <h3>${row["اسم المحمية"] || "-"}</h3>
                        ${row["Brief"] ? `<p class="brief-text">${row["Brief"]}</p>` : ""}
                        <div class="info-row">
                            <span class="info-label">المحافظة</span>
                            <span class="info-value">${row["المحافظة"] || "-"}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">النوع السائد</span>
                            <span class="info-value">${row["النوع السائد"] || "-"}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">المساحة /هـ</span>
                            <span class="info-value">${row["المساحة /هـ"] || "-"}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">سنة التأسيس</span>
                            <span class="info-value">${row["سنة التأسيس"] || "-"}</span>
                        </div>
<div class="info-row">
    <span class="info-label">الهدف من الإعلان</span>
    <span class="info-value">${row["الهدف من الإعلان"] || "-"}</span>
</div>
                        <div class="info-row">
                            <span class="info-label">رقم قرار الإعلان</span>
                            <span class="info-value">${row["رقم قرار الإعلان"] || "-"}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">تاريخ الإعلان</span>
                            <span class="info-value">${row["تاريخ الإعلان"] || "-"}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">الوضع الإداري</span>
                            <span class="info-value">${row["الوضع الإداري"] || "-"}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Brief Reference</span>
                            <span class="info-value">${row["Brief Reference"] || "-"}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">ملاحظات</span>
                            <span class="info-value">${escapeHtml(row["ملاحظات"]) || "-"}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Location</span>
                            <span class="info-value">${locationUrl ? `<a href="${escapeHtml(locationUrl)}" target="_blank" rel="noopener noreferrer">📍 عرض الموقع</a>` : "-"}</span>
                        </div>
                        ${row["التصنيف الجديد"] ? `
                        <div class="info-row" style="margin-top:8px;">
                            <span class="info-label">تصنيف المحمية</span>
                        
                        <span class="badge">${row["التصنيف الجديد"]}</span>` : ""}
                    
                </div>
            `;
        });

    } catch (error) {
        statusDiv.textContent = "";
        resultsDiv.innerHTML = `<div class="error-msg">خطأ غير متوقع: ${error.message}</div>`;
    }
}
</script>

</body>
</html>
